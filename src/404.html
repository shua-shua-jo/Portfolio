<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 | Page Not Found</title>
		<style>
			:root {
				--bg: #0f172a;
				--panel: #111827;
				--panel-alt: #1f2937;
				--text: #e5e7eb;
				--muted: #94a3b8;
				--accent: #7c3aed;
				--accent-2: #22c55e;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: linear-gradient(135deg, var(--bg), #111827 45%, #0b1120);
				color: var(--text);
				font-family: Arial, Helvetica, sans-serif;
			}

			.card {
				width: min(90vw, 640px);
				padding: 3rem 2rem;
				border: 1px solid rgba(148, 163, 184, 0.2);
				border-radius: 20px;
				background: rgba(17, 24, 39, 0.9);
				box-shadow: 0 24px 60px rgba(15, 23, 42, 0.5);
				text-align: center;
			}

			.eyebrow {
				display: inline-block;
				margin-bottom: 1rem;
				padding: 0.4rem 0.8rem;
				border-radius: 999px;
				background: rgba(124, 58, 237, 0.15);
				color: #c4b5fd;
				font-size: 0.75rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}

			h1 {
				margin: 0;
				font-size: clamp(3rem, 8vw, 6rem);
				line-height: 0.9;
				letter-spacing: -0.06em;
			}

			p {
				margin: 1rem auto 0;
				max-width: 36rem;
				color: var(--muted);
				font-size: 1.05rem;
				line-height: 1.7;
			}

			.actions {
				margin-top: 2rem;
				display: flex;
				justify-content: center;
				gap: 1rem;
				flex-wrap: wrap;
			}

			a {
				display: inline-block;
				padding: 0.85rem 1.5rem;
				border-radius: 999px;
				text-decoration: none;
				font-weight: 700;
				transition:
					transform 0.2s ease,
					opacity 0.2s ease;
			}

			a:hover {
				transform: translateY(-1px);
			}

			.primary {
				background: linear-gradient(135deg, var(--accent), #8b5cf6);
				color: white;
			}

			.secondary {
				background: rgba(148, 163, 184, 0.08);
				color: var(--text);
				border: 1px solid rgba(148, 163, 184, 0.2);
			}
		</style>
	</head>

	<body>
		<main class="card" role="main">
			<div class="eyebrow">Portfolio</div>
			<h1>404</h1>
			<p>
				Oops — the page you were looking for doesn't exist or may have moved. Let's get you back to
				the good stuff.
			</p>
			<div class="actions">
				<a class="primary" href="/">Go home</a>
				<a class="secondary" href="mailto:ejdl.abello03@gmail.com">Contact me</a>
			</div>
		</main>
	</body>
</html>
